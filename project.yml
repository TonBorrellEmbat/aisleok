name: AisleOK
options:
  bundleIdPrefix: com.tonborrellembat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: AisleOK
    INFOPLIST_KEY_NSCameraUsageDescription: "Scan grocery barcodes and ingredient labels."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AisleOK:
    type: application
    platform: iOS
    sources:
      - path: AisleOK
      - path: AisleOK_trigger_tags_v1.json
        type: file
        buildPhase: resources
      - path: Products.storekit
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonborrellembat.aisleok
        PRODUCT_NAME: AisleOK
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_TESTABILITY: YES
    info:
      path: AisleOK/Info.plist
      properties:
        CFBundleDisplayName: AisleOK
        NSCameraUsageDescription: "Scan grocery barcodes and ingredient labels."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  AisleOKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AisleOKTests
      - path: AisleOK_trigger_tags_v1.json
        type: file
        buildPhase: resources
    dependencies:
      - target: AisleOK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonborrellembat.aisleok.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AisleOK:
    build:
      targets:
        AisleOK: all
        AisleOKTests: [test]
    run:
      storeKitConfiguration: Products.storekit
    test:
      targets:
        - AisleOKTests
      gatherCoverageData: false
      storeKitConfiguration: Products.storekit
